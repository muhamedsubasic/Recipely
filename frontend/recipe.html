<!DOCTYPE html>
<html>
<head>
  <title>Recipe</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="recipeDetail"></div>
  <h3>Comments</h3>
  <div id="commentsContainer"></div>
  <form id="commentForm">
    <input type="text" id="author" placeholder="Your name" required>
    <textarea id="commentText" placeholder="Your comment" required></textarea>
    <button type="submit">Add Comment</button>
  </form>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const recipeId = urlParams.get('id');

    async function loadRecipe() {
      const res = await fetch(`/api/recipes/${recipeId}`);
      const recipe = await res.json();
      document.getElementById('recipeDetail').innerHTML = `
        <h1>${recipe.title}</h1>
        <p><strong>Category:</strong> ${recipe.category}</p>
        <p>${recipe.content}</p>
        <h4>Ingredients</h4><ul>${(recipe.ingredients || []).map(i => `<li>${i}</li>`).join('')}</ul>
      `;
    }

    // Composite pattern rendering: handles both single comment and replies uniformly
    function renderCommentTree(comment, level = 0) {
      let html = `<div class="comment" style="margin-left: ${level * 20}px">
                    <strong>${escapeHtml(comment.author)}</strong>: ${escapeHtml(comment.text)}
                  </div>`;
      if (comment.replies && comment.replies.length) {
        for (let reply of comment.replies) {
          html += renderCommentTree(reply, level + 1);
        }
      }
      return html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    async function loadComments() {
      const res = await fetch(`/api/comments/${recipeId}`);
      const threads = await res.json();
      const container = document.getElementById('commentsContainer');
      if (!threads.length) {
        container.innerHTML = '<p>No comments yet.</p>';
        return;
      }
      let allHtml = '';
      for (let thread of threads) {
        allHtml += renderCommentTree(thread, 0);
      }
      container.innerHTML = allHtml;
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = document.getElementById('author').value;
      const text = document.getElementById('commentText').value;
      const response = await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipeId, author, text, parentId: null })
      });
      if (response.ok) {
        document.getElementById('commentText').value = '';
        loadComments();
      } else {
        alert('Failed to add comment');
      }
    });

    loadRecipe();
    loadComments();
  </script>
</body>
</html>
