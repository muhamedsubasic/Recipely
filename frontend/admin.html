<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Admin Panel</h1>
  <input type="password" id="adminPass" placeholder="Password">
  <button id="loginBtn">Login</button>
  <div id="adminContent" style="display:none;">
    <h2>Create New Recipe</h2>
    <form id="recipeForm">
      <input type="text" id="title" placeholder="Title" required><br>
      <textarea id="content" placeholder="Content" required></textarea><br>
      <input type="text" id="ingredients" placeholder="Ingredients (comma separated)"><br>
      <select id="category">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dessert">Dessert</option>
      </select><br>
      <button type="submit">Create Recipe</button>
    </form>
    <div id="recipesList"></div>
  </div>
  <script>
    const PASSWORD = 'admin123';
    document.getElementById('loginBtn').onclick = () => {
      if (document.getElementById('adminPass').value === PASSWORD) {
        document.getElementById('adminContent').style.display = 'block';
        loadRecipesForAdmin();
      } else alert('Wrong password');
    };
    async function loadRecipesForAdmin() {
      const res = await fetch('/api/recipes');
      const recipes = await res.json();
      const container = document.getElementById('recipesList');
      container.innerHTML = '<h3>Existing Recipes</h3>' + recipes.map(r => `
        <div>
          <strong>${r.title}</strong>
          <button onclick="deleteRecipe('${r.id}')">Delete</button>
        </div>
      `).join('');
    }
    async function deleteRecipe(id) {
      await fetch(`/api/recipes/${id}`, { method: 'DELETE' });
      loadRecipesForAdmin();
    }
    document.getElementById('recipeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ingredients = document.getElementById('ingredients').value.split(',').map(i => i.trim());
      await fetch('/api/recipes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('title').value,
          content: document.getElementById('content').value,
          ingredients,
          category: document.getElementById('category').value
        })
      });
      alert('Recipe created');
      loadRecipesForAdmin();
    });
  </script>
</body>
</html>
