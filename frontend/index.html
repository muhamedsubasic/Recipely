<!DOCTYPE html>
<html>
<head>
  <title>Recipe Blog</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>🍽️ Recipe Blog</h1>
  <div class="filter-bar">
    <label>Filter by category:</label>
    <select id="categoryFilter">
      <option value="">All</option>
      <option value="breakfast">Breakfast</option>
      <option value="lunch">Lunch</option>
      <option value="dessert">Dessert</option>
    </select>
    <button id="applyFilter" class="submit-btn">Apply</button>
  </div>
  <div id="recipesList" class="recipes-grid"></div>
  <script>
    async function loadRecipes() {
      const category = document.getElementById('categoryFilter').value;
      let url = '/api/recipes';
      if (category) url += `?filterBy=category&value=${category}`;
      const res = await fetch(url);
      const recipes = await res.json();
      const container = document.getElementById('recipesList');
      if (recipes.length === 0) {
        container.innerHTML = '<p class="no-comments">No recipes found. Add some via the admin panel.</p>';
        return;
      }
      container.innerHTML = recipes.map(r => `
        <div class="recipe-card">
          ${r.image ? `<img src="${r.image}" alt="${r.title}" class="recipe-image" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">` : `<div class="recipe-image-placeholder">📖</div>`}
          <div class="recipe-card-content">
            <h3><a href="/recipe.html?id=${r.id}">${escapeHtml(r.title)}</a></h3>
            <span class="recipe-category-small">${escapeHtml(r.category)}</span>
            <p>${escapeHtml(r.content.substring(0, 100))}...</p>
          </div>
        </div>
      `).join('');
    }
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    document.getElementById('applyFilter').addEventListener('click', loadRecipes);
    loadRecipes();
  </script>
</body>
</html>
